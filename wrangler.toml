#:schema node_modules/wrangler/config-schema.json
name = "lifestyle-stock-overview"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
main = "worker/index.ts"

[observability]
enabled = true

# =============================================================================
# CONTAINER (where Next.js runs)
# =============================================================================
# The whole Next.js app runs inside a Cloudflare Container. The Worker above
# is just a thin proxy that forwards every request to the container.
[[containers]]
class_name = "AppContainer"
image = "./Dockerfile"
max_instances = 5
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "APP_CONTAINER"
class_name = "AppContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppContainer"]

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
[vars]
# Auth0
APP_BASE_URL = "https://lifestyle-stock-overview.icy-bonus-6ebb.workers.dev"
AUTH0_DOMAIN = "fourrun.eu.auth0.com"

# Centra API base URLs (not secrets)
SNEAKY_CENTRA_BASE_URL = "https://sneakysteve.centra.com/graphql"
VARG_CENTRA_BASE_URL = "https://varg.centra.com/graphql"
DISENTIS_CENTRA_BASE_URL = "https://disentis.centra.com/graphql"

# R2 bucket name (the actual S3 endpoint + credentials are secrets)
R2_BUCKET = "lifestyle-stock-overview-storage"

# =============================================================================
# SECRETS (set via Dashboard or CLI)
# =============================================================================
# wrangler secret put AUTH0_SECRET
# wrangler secret put AUTH0_ISSUER_BASE_URL
# wrangler secret put AUTH0_CLIENT_ID
# wrangler secret put AUTH0_CLIENT_SECRET
#
# wrangler secret put SNEAKY_CENTRA_API_KEY
# wrangler secret put SNEAKY_ZETTLE_CLIENT_ID
# wrangler secret put SNEAKY_ZETTLE_API_KEY
#
# wrangler secret put VARG_CENTRA_API_KEY
# wrangler secret put VARG_ZETTLE_CLIENT_ID
# wrangler secret put VARG_ZETTLE_API_KEY
#
# wrangler secret put DISENTIS_CENTRA_API_KEY
#
# wrangler secret put ELASTICSEARCH_URL
# wrangler secret put ELASTICSEARCH_API_KEY
#
# wrangler secret put SNEAKY_NE_PROD_PRIMARY_CONNECTION_STRING
#
# wrangler secret put OPEN_API_KEY
#
# # R2 S3-compatible credentials (create token in Dashboard → R2 → Manage R2 API Tokens):
# wrangler secret put R2_ACCESS_KEY_ID
# wrangler secret put R2_SECRET_ACCESS_KEY
# wrangler secret put R2_ENDPOINT
# =============================================================================
